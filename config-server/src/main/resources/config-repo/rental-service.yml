# Configuration du rental-service (Spring Boot)
# Ce fichier est servi par le Config Server au rental-service au démarrage

server:
  port: 8081

spring:
  application:
    name: rental-service

  datasource:
    url: jdbc:mysql://mysql-db:3306/rentaldb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # RabbitMQ - communication asynchrone
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
