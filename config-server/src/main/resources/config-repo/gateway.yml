# Configuration de la Gateway
# Ce fichier est servi par le Config Server à la Gateway au démarrage

server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        # Route vers vehicle-service
        # Toute requête commençant par /api/vehicles est redirigée vers vehicle-service
        - id: vehicle-service
          uri: lb://vehicle-service   # lb:// = load balancer via Eureka
          predicates:
            - Path=/api/vehicles/**
          filters:
            - name: CircuitBreaker
              args:
                name: vehicle-service-circuit-breaker
                fallbackUri: forward:/fallback/vehicle

        # Route vers rental-service
        - id: rental-service
          uri: lb://rental-service
          predicates:
            - Path=/api/rentals/**
          filters:
            - name: CircuitBreaker
              args:
                name: rental-service-circuit-breaker
                fallbackUri: forward:/fallback/rental

        - id: rental-service-docs
          uri: lb://rental-service
          predicates:
            - Path=/v3/api-docs/rental-service
          filters:
            - RewritePath=/v3/api-docs/rental-service, /v3/api-docs

        - id: vehicle-service-docs
          uri: lb://vehicle-service
          predicates:
            - Path=/v3/api-docs/vehicle-service
          filters:
            - RewritePath=/v3/api-docs/vehicle-service, /swagger/v1/swagger.json

      default-filters:
        - AddResponseHeader=X-Response-By, CarRental-Gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
