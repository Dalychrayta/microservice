apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-service
  namespace: carrental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-service
  template:
    metadata:
      labels:
        app: vehicle-service
    spec:
      containers:
        - name: vehicle-service
          image: carrental/vehicle-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8082
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres-db;Port=5432;Database=vehicledb;Username=postgres;Password=postgres
            - name: Keycloak__Authority
              value: http://keycloak:8180/realms/car-rental
            - name: RabbitMQ__Host
              value: rabbitmq
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__Username
              value: guest
            - name: RabbitMQ__Password
              value: guest
            - name: Eureka__Client__ServiceUrl
              value: http://eureka-server:8761/eureka/
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-service
  namespace: carrental
spec:
  selector:
    app: vehicle-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP
