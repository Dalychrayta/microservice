name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["main", "rent-car"]
  pull_request:
    branches: ["main", "rent-car"]

jobs:
  java-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-server, eureka-server, gateway, rental-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Java service
        working-directory: ./${{ matrix.service }}
        run: mvn -B -DskipTests package

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: ./vehicle-service
        run: dotnet restore

      - name: Build
        working-directory: ./vehicle-service
        run: dotnet build --configuration Release --no-restore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  docker-publish:
    runs-on: ubuntu-latest
    needs: [java-build, dotnet-build, frontend-build]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service: [config-server, eureka-server, gateway, rental-service, vehicle-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image owner
        id: image-owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ steps.image-owner.outputs.owner }}/microservice-${{ matrix.service }}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          SHA_TAG="sha-${GITHUB_SHA::7}"

          docker build \
            -t "$IMAGE:$BRANCH_TAG" \
            -t "$IMAGE:$SHA_TAG" \
            ./${{ matrix.service }}

          docker push "$IMAGE:$BRANCH_TAG"
          docker push "$IMAGE:$SHA_TAG"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag "$IMAGE:$BRANCH_TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
